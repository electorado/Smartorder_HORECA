services:
  mongodb:
    image: mongo:latest
    container_name: fb_smartorder_db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-supplypassword}
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: