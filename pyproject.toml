[project]
name = "fb-smartorder"
version = "0.1.0"
description = "An Intelligent Data Pipeline and Order Automation System for the Food & Beverage Sector."
readme = "README.md"
authors = [
    { name = "electorado", email = "pamoncayo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "easyocr>=1.7.2",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "pymongo>=4.10.0",
    "pypdf>=6.0.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.12",
    "rapidfuzz>=3.10.0",
    "streamlit>=1.40.0",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"
